<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="style.css">
        <title>Login</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Login Page">
    </head>

    <body>
        <div id="main">
            <img src="account.svg" alt="web_icon" id="profile">
            <h1 id="main_title">Login to your account</h1>

            <div id="input_content">
                <h3 id="email_title">Email Address</h3>
                <div id="email_div">
                    <label for="email">
                        <img src="mail.svg" alt="email_icon">
                    </label>
                    <input type="email" id="email" placeholder="Enter your Email">
                </div>
                
                <h3 id="password_title">Password</h3>
                <div id="password_div">
                    <label for="password">
                        <img src="password.svg" alt="password_icon">
                    </label>
                    <input type="password" id="password" placeholder="Enter your Password">
                    <button>
                        <img src="eye.svg" alt="eye_icon">
                    </button>
                </div>
            </div>

            <div id="check_div">
                <input type="checkbox" name="checkbox" id="remember">
                <label for="remember">Keep me logged in</label>
                <a href="">Forgot password ?</a>
            </div>

            <button id="login_btn">Login</button>

            <h1 id="divider">or</h1>

            <div id="buttons">
                <div class="btn_content">
                    <button>
                        <img src="apple.svg" alt="apple_icon">
                    </button>
                </div>

                <div class="btn_content">
                    <button>
                        <img src="google.svg" alt="google_icon">
                    </button>
                </div>

                <div class="btn_content">
                    <button>
                        <img src="facebook.svg" alt="facebook_icon">
                    </button>
                </div>
            </div>
        </div>
    </body>
</html>
